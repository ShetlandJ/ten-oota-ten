<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f5cf1d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Ccircle cx=%2232%22 cy=%2232%22 r=%2230%22 fill=%22%23f5cf1d%22 stroke=%22%2316140f%22 stroke-width=%224%22/%3E%3Ctext x=%2232%22 y=%2242%22 font-size=%2228%22 font-weight=%22900%22 text-anchor=%22middle%22 font-family=%22Arial Black%22%3E10%3C/text%3E%3C/svg%3E" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="10 Oota 10" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <title>10 Oota 10: Costume Rater</title>
    <style>
      :root {
        --ink: #16140f;
        --paper: #ffffff;
        --yellow: #f5cf1d;
        --story-a: #ff9a1f;
        --story-b: #ff4a2e;
        --story-c: #ff2f6e;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--yellow);
        color: var(--ink);
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
        font-family: 'Arial Black', Impact, 'Helvetica Neue', sans-serif;
      }

      /* Landscape stage. Held upright with rotation lock on, the page is portrait,
         so turn the stage on its side to fill the phone the landscape way. */
      #stage {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        container-type: size;
        touch-action: none;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6cqh;
        /* Same inset both sides, so a camera cutout on one edge doesn't push the rating off centre. */
        --side: max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
        padding: max(12px, env(safe-area-inset-top)) var(--side) max(12px, env(safe-area-inset-bottom));
      }

      @media (orientation: portrait) {
        #stage {
          width: 100vh;
          width: 100dvh;
          height: 100vw;
          transform-origin: top left;
          transform: translateX(100vw) rotate(90deg);
        }
      }

      /* Comic sunburst behind the number, shown on landing. */
      #burst {
        position: absolute;
        left: 50%;
        top: 42%;
        width: 160cqw;
        aspect-ratio: 1;
        translate: -50% -50%;
        background: repeating-conic-gradient(rgba(255, 255, 255, 0.35) 0 7deg, transparent 7deg 18deg);
        border-radius: 50%;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }

      #burst.on {
        opacity: 1;
        animation: spin 14s linear infinite;
      }

      @keyframes spin {
        to {
          rotate: 360deg;
        }
      }

      .rating {
        position: relative;
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 3cqw;
        line-height: 1;
        font-style: italic;
        font-weight: 900;
        letter-spacing: -0.03em;
      }

      .num {
        font-size: min(52cqh, 24cqw);
        color: var(--paper);
        -webkit-text-stroke: min(1.6cqh, 0.8cqw) var(--ink);
        paint-order: stroke fill;
        text-shadow: min(2.2cqh, 1cqw) min(2.2cqh, 1cqw) 0 var(--ink);
      }

      /* Fixed width so "oota 10" never shifts between 9 and 10. */
      #pick {
        display: inline-block;
        width: 1.32em;
        text-align: center;
        touch-action: none;
        cursor: ns-resize;
      }

      #pick.counting {
        color: var(--story-b);
      }

      .oota {
        font-size: min(17cqh, 8cqw);
        color: var(--ink);
      }

      .actions {
        position: relative;
        display: flex;
        gap: 3cqw;
        transition: opacity 0.25s;
      }

      .busy .actions {
        opacity: 0;
        pointer-events: none;
      }

      .btn {
        min-width: 30cqw;
        padding: 0.45em 1em;
        font: italic 900 min(8cqh, 4cqw) / 1 'Arial Black', Impact, 'Helvetica Neue', sans-serif;
        text-transform: uppercase;
        letter-spacing: 0.02em;
        color: var(--ink);
        background: var(--paper);
        border: 4px solid var(--ink);
        border-radius: 16px;
        box-shadow: 5px 5px 0 var(--ink);
        cursor: pointer;
        touch-action: manipulation;
      }

      .btn.reset {
        min-width: 0;
      }

      .btn:active {
        translate: 3px 3px;
        box-shadow: 2px 2px 0 var(--ink);
      }

      .btn.random {
        color: var(--paper);
        background: linear-gradient(135deg, var(--story-a), var(--story-b) 55%, var(--story-c));
        text-shadow: 2px 2px 0 var(--ink);
      }

      .chips {
        position: relative;
        display: flex;
        gap: 1.4cqw;
      }

      .chip {
        width: 8cqw;
        aspect-ratio: 1;
        padding: 0;
        font: italic 900 min(9cqh, 4.2cqw) / 1 'Arial Black', Impact, 'Helvetica Neue', sans-serif;
        color: var(--ink);
        background: var(--paper);
        border: 3px solid var(--ink);
        border-radius: 12px;
        box-shadow: 3px 3px 0 var(--ink);
        cursor: pointer;
        touch-action: manipulation;
      }

      #confetti {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .chip[aria-pressed='true'] {
        background: var(--ink);
        color: var(--yellow);
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="burst"></div>
      <div class="rating" aria-live="polite">
        <span class="num" id="pick">10</span>
        <span class="oota">oota</span>
        <span class="num">10</span>
      </div>
      <div class="actions" id="actions">
        <button class="btn" id="picker-btn" type="button">Picker</button>
        <button class="btn random" id="random-btn" type="button">Judge</button>
        <button class="btn reset" id="reset-btn" type="button">Reset</button>
      </div>
      <div class="chips" id="chips" hidden></div>
      <canvas id="confetti"></canvas>
    </div>

    <script type="module">
      const stage = document.getElementById('stage');
      const pick = document.getElementById('pick');
      const burst = document.getElementById('burst');
      const actions = document.getElementById('actions');
      const chips = document.getElementById('chips');

      let value = 10;
      let busy = false;

      // ---------- sound ----------
      let ctx = null;
      function audio() {
        if (!ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (AC) ctx = new AC();
        }
        if (ctx && ctx.state === 'suspended') ctx.resume();
        return ctx;
      }

      function tone(freq, dur, type = 'square', gain = 0.12, at = 0) {
        const ac = audio();
        if (!ac) return;
        const t = ac.currentTime + at;
        const osc = ac.createOscillator();
        const g = ac.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        g.gain.setValueAtTime(gain, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g).connect(out(ac));
        osc.start(t);
        osc.stop(t + dur + 0.02);
      }

      // Everything goes through one compressor so the celebration can stack sounds without clipping.
      let master = null;
      function out(ac) {
        if (!master) {
          master = ac.createDynamicsCompressor();
          master.connect(ac.destination);
        }
        return master;
      }

      let noiseBuf = null;
      function noise(ac) {
        if (!noiseBuf) {
          noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
          const d = noiseBuf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
        }
        return noiseBuf;
      }

      // A crowd clapping: lots of short band-passed noise bursts, thinning out.
      function applause(dur = 2.6) {
        const ac = audio();
        if (!ac) return;
        const t0 = ac.currentTime + 0.3;
        for (let i = 0; i < 140; i++) {
          const at = t0 + dur * Math.random() ** 1.6;
          const src = ac.createBufferSource();
          src.buffer = noise(ac);
          const bp = ac.createBiquadFilter();
          bp.type = 'bandpass';
          bp.frequency.value = 900 + Math.random() * 1800;
          bp.Q.value = 1.2;
          const g = ac.createGain();
          const peak = 0.5 * (1 - (at - t0) / dur) + 0.05;
          g.gain.setValueAtTime(peak, at);
          g.gain.exponentialRampToValueAtTime(0.0001, at + 0.05);
          src.connect(bp).connect(g).connect(out(ac));
          src.start(at, Math.random() * 0.9, 0.07);
        }
      }

      // Party blower: a rising buzzy honk, twice.
      function partyHorn(at) {
        const ac = audio();
        if (!ac) return;
        for (const [off, from, to] of [[0, 330, 520], [0.32, 360, 700]]) {
          const t = ac.currentTime + at + off;
          const osc = ac.createOscillator();
          const lp = ac.createBiquadFilter();
          const g = ac.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(from, t);
          osc.frequency.exponentialRampToValueAtTime(to, t + 0.22);
          lp.type = 'lowpass';
          lp.frequency.value = 2200;
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(0.18, t + 0.03);
          g.gain.setValueAtTime(0.18, t + 0.2);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
          osc.connect(lp).connect(g).connect(out(ac));
          osc.start(t);
          osc.stop(t + 0.3);
        }
      }

      const tick = (n) => tone(420 + n * 40, 0.05, 'square', 0.07);
      const beep = () => tone(660, 0.18, 'triangle', 0.2);
      const celebrate = () => {
        [523, 659, 784].forEach((f, i) => tone(f, 0.14, 'triangle', 0.22, i * 0.11));
        // Big held chord on the last note.
        [523, 659, 784, 1047].forEach((f) => tone(f, 1.4, 'triangle', 0.14, 0.33));
        tone(1047, 1.4, 'square', 0.04, 0.33);
        partyHorn(0.5);
        applause();
      };

      // ---------- keep the phone awake, go landscape where the browser allows ----------
      let primed = false;
      async function prime() {
        if (primed) return;
        primed = true;
        audio();
        try {
          await navigator.wakeLock?.request('screen');
        } catch {}
        try {
          if (document.documentElement.requestFullscreen && !document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
            await screen.orientation?.lock?.('landscape');
          }
        } catch {}
      }
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && primed) {
          navigator.wakeLock?.request('screen').catch(() => {});
        }
      });

      // ---------- number ----------
      function show(n, { dir = 1, fast = false } = {}) {
        pick.textContent = n;
        pick.animate(
          [
            { transform: `translateY(${dir * -35}%)`, opacity: 0.2 },
            { transform: 'translateY(0)', opacity: 1 },
          ],
          { duration: fast ? 70 : 160, easing: 'cubic-bezier(.2,.9,.3,1.2)' },
        );
      }

      function setValue(n, dir = 1) {
        value = n;
        show(n, { dir });
        burst.classList.toggle('on', n === 10);
        renderChips();
      }

      const wrap = (n) => ((((n - 1) % 10) + 10) % 10) + 1;

      // ---------- picker ----------
      for (let n = 1; n <= 10; n++) {
        const b = document.createElement('button');
        b.className = 'chip';
        b.type = 'button';
        b.textContent = n;
        b.dataset.n = n;
        chips.append(b);
      }

      function renderChips() {
        for (const b of chips.children) b.setAttribute('aria-pressed', String(Number(b.dataset.n) === value));
      }

      function openPicker(open) {
        chips.hidden = !open;
        actions.hidden = open;
      }

      document.getElementById('picker-btn').addEventListener('click', () => {
        prime();
        openPicker(true);
      });

      chips.addEventListener('click', (e) => {
        const b = e.target.closest('.chip');
        if (!b) return;
        const n = Number(b.dataset.n);
        tick(n);
        setValue(n, n >= value ? 1 : -1);
        openPicker(false);
      });

      // Swipe the left number up/down to roll it by one.
      let startY = null;
      let startX = null;
      pick.addEventListener('pointerdown', (e) => {
        if (busy) return;
        prime();
        startY = e.clientY;
        startX = e.clientX;
      });
      window.addEventListener('pointerup', (e) => {
        if (startY === null) return;
        // The stage is turned 90° in portrait, so screen-x is the stage's vertical.
        const portrait = matchMedia('(orientation: portrait)').matches;
        const delta = portrait ? e.clientX - startX : startY - e.clientY;
        startY = startX = null;
        if (Math.abs(delta) < 24) return;
        const dir = delta > 0 ? 1 : -1;
        const n = wrap(value + dir);
        tick(n);
        setValue(n, dir);
      });

      // ---------- Halloween confetti: paper bits, bats, pumpkins, ghosts ----------
      const confetti = (() => {
        const canvas = document.getElementById('confetti');
        const g = canvas.getContext('2d');
        const PAPER = ['#ff7a00', '#16140f', '#9be22d', '#ffffff', '#ff4a2e'];
        let parts = [];
        let raf = 0;
        let W = 0;
        let H = 0;
        let last = 0;

        // Half a bat (right wing), mirrored when drawn. Unit size, centred on the body.
        const WING = [[0, -0.15], [0.12, -0.32], [0.18, -0.1], [0.6, -0.45], [1, -0.18], [0.8, 0.02], [0.75, 0.22], [0.6, 0.08], [0.5, 0.24], [0.36, 0.1], [0.2, 0.28], [0.1, 0.14], [0, 0.32]];

        function bat(p) {
          const flap = 0.55 + 0.45 * Math.abs(Math.sin(p.age * 14 + p.phase));
          g.fillStyle = '#16140f';
          for (const side of [1, -1]) {
            g.beginPath();
            WING.forEach(([x, y], i) => (i ? g.lineTo : g.moveTo).call(g, x * side, y * (i > 2 && i < 11 ? flap : 1)));
            g.closePath();
            g.fill();
          }
        }

        function pumpkin() {
          g.fillStyle = '#ff7a00';
          g.strokeStyle = '#b84a00';
          g.lineWidth = 0.05;
          for (const [x, rx] of [[-0.28, 0.32], [0.28, 0.32], [0, 0.34]]) {
            g.beginPath();
            g.ellipse(x, 0.05, rx, 0.42, 0, 0, Math.PI * 2);
            g.fill();
            g.stroke();
          }
          g.fillStyle = '#3f7d1c';
          g.fillRect(-0.06, -0.55, 0.12, 0.2);
          // Jack-o'-lantern face.
          g.fillStyle = '#16140f';
          for (const s of [-1, 1]) {
            g.beginPath();
            g.moveTo(0.22 * s, -0.12);
            g.lineTo(0.08 * s, 0.04);
            g.lineTo(0.34 * s, 0.04);
            g.fill();
          }
          g.beginPath();
          g.moveTo(-0.32, 0.16);
          g.lineTo(0.32, 0.16);
          g.lineTo(0.2, 0.3);
          g.lineTo(0.08, 0.22);
          g.lineTo(-0.04, 0.32);
          g.lineTo(-0.16, 0.22);
          g.lineTo(-0.24, 0.3);
          g.closePath();
          g.fill();
        }

        function ghost(p) {
          g.fillStyle = '#ffffff';
          g.strokeStyle = '#16140f';
          g.lineWidth = 0.07;
          g.beginPath();
          g.moveTo(-0.38, 0.45);
          g.lineTo(-0.38, -0.05);
          g.arc(0, -0.05, 0.38, Math.PI, 0);
          g.lineTo(0.38, 0.45);
          const wob = Math.sin(p.age * 8 + p.phase) * 0.06;
          for (let i = 0; i < 4; i++) {
            const x0 = 0.38 - i * 0.19;
            g.quadraticCurveTo(x0 - 0.095, 0.3 + (i % 2 ? -wob : wob), x0 - 0.19, 0.45);
          }
          g.closePath();
          g.fill();
          g.stroke();
          g.fillStyle = '#16140f';
          for (const s of [-1, 1]) {
            g.beginPath();
            g.ellipse(0.14 * s, -0.08, 0.06, 0.1, 0, 0, Math.PI * 2);
            g.fill();
          }
        }

        function spawn() {
          const unit = Math.min(W, H);
          const list = [];
          const add = (kind, x, y, vx, vy) => {
            const big = kind !== 'paper';
            list.push({
              kind,
              x,
              y,
              vx,
              vy,
              size: unit * (big ? 0.07 + Math.random() * 0.05 : 0.018 + Math.random() * 0.014),
              rot: Math.random() * Math.PI * 2,
              vr: (Math.random() - 0.5) * (big ? 3 : 12),
              phase: Math.random() * 10,
              color: PAPER[Math.floor(Math.random() * PAPER.length)],
              age: 0,
            });
          };
          const kinds = () => {
            const r = Math.random();
            return r < 0.8 ? 'paper' : r < 0.89 ? 'bat' : r < 0.95 ? 'pumpkin' : 'ghost';
          };
          // Cannon bursts from both bottom corners, then a shower from the top.
          for (const side of [0, 1]) {
            for (let i = 0; i < 70; i++) {
              const a = (side ? -1 : 1) * (0.25 + Math.random() * 0.55);
              const v = H * (0.9 + Math.random() * 0.4);
              add(kinds(), side ? W : 0, H, Math.sin(a) * v * 0.9, -Math.cos(a) * v);
            }
          }
          for (let i = 0; i < 80; i++) add(kinds(), Math.random() * W, -unit * 0.1 - Math.random() * H * 1.2, (Math.random() - 0.5) * 60, 40 + Math.random() * 80);
          return list;
        }

        function frame(now) {
          const dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          g.setTransform(1, 0, 0, 1, 0, 0);
          g.clearRect(0, 0, canvas.width, canvas.height);
          const dpr = canvas.width / W;
          const grav = H * 0.9;
          parts = parts.filter((p) => p.y < H + p.size * 2 && p.age < 9);
          for (const p of parts) {
            p.age += dt;
            const flutter = p.kind === 'paper' ? 2.2 : p.kind === 'bat' ? 1.6 : 1.1;
            p.vy += grav * dt;
            // Air drag: terminal velocity keeps the fall slow and floaty.
            const term = H * (p.kind === 'paper' ? 0.14 : 0.2);
            if (p.vy > term) p.vy += (term - p.vy) * Math.min(1, dt * 8);
            p.vx *= 1 - Math.min(1, dt * flutter);
            p.x += (p.vx + Math.sin(p.age * 3 + p.phase) * H * 0.05) * dt;
            p.y += p.vy * dt;
            p.rot += p.vr * dt;

            g.setTransform(dpr, 0, 0, dpr, p.x * dpr, p.y * dpr);
            g.rotate(p.kind === 'paper' ? p.rot : Math.sin(p.rot) * 0.4);
            if (p.kind === 'paper') {
              g.fillStyle = p.color;
              // Squash the height to fake the paper tumbling.
              const h = p.size * 0.6 * Math.abs(Math.cos(p.age * 9 + p.phase)) + 0.5;
              g.fillRect(-p.size / 2, -h / 2, p.size, h);
              continue;
            }
            g.scale(p.size, p.size);
            if (p.kind === 'bat') bat(p);
            else if (p.kind === 'pumpkin') pumpkin();
            else ghost(p);
          }
          if (parts.length) raf = requestAnimationFrame(frame);
          else stop();
        }

        function start() {
          stop();
          W = stage.clientWidth;
          H = stage.clientHeight;
          const dpr = Math.min(2, window.devicePixelRatio || 1);
          canvas.width = Math.round(W * dpr);
          canvas.height = Math.round(H * dpr);
          parts = spawn();
          last = performance.now();
          raf = requestAnimationFrame(frame);
        }

        function stop() {
          cancelAnimationFrame(raf);
          parts = [];
          g.setTransform(1, 0, 0, 1, 0, 0);
          g.clearRect(0, 0, canvas.width, canvas.height);
        }

        return { start, stop };
      })();

      // ---------- random (always lands on 10) ----------
      const wait = (ms) => new Promise((r) => setTimeout(r, ms));

      async function random() {
        if (busy) return;
        busy = true;
        prime();
        openPicker(false);
        stage.classList.add('busy');
        burst.classList.remove('on');

        pick.classList.add('counting');
        for (const c of [3, 2, 1]) {
          show(c);
          beep();
          await wait(800);
        }
        pick.classList.remove('counting');

        // Run backwards from 10 so the last step is always 10; vary the length so it never looks rehearsed.
        const steps = 30 + Math.floor(Math.random() * 10);
        for (let i = 1; i <= steps; i++) {
          const n = wrap(10 - (steps - i));
          const t = i / steps;
          value = n;
          show(n, { fast: t < 0.6 });
          tick(n);
          await wait(i === steps ? 0 : 40 + 620 * t ** 3);
        }

        celebrate();
        confetti.start();
        pick.animate(
          [{ transform: 'scale(1)' }, { transform: 'scale(1.35) rotate(-6deg)' }, { transform: 'scale(0.95)' }, { transform: 'scale(1)' }],
          { duration: 600, easing: 'ease-out' },
        );
        burst.classList.add('on');
        renderChips();
        await wait(900);
        stage.classList.remove('busy');
        busy = false;
      }

      document.getElementById('random-btn').addEventListener('click', random);

      // Blank "?" between costumes, so the next one doesn't open on the last score.
      function reset() {
        prime();
        openPicker(false);
        value = 0;
        confetti.stop();
        burst.classList.remove('on');
        show('?', { dir: -1 });
        renderChips();
      }
      document.getElementById('reset-btn').addEventListener('click', reset);

      if ('serviceWorker' in navigator && !import.meta.env?.DEV) {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      }

      renderChips();
      burst.classList.add('on');
    </script>
  </body>
</html>
